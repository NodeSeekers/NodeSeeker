name: Build and publish extension release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build extension ZIP
        run: npm run package

      - name: Create stable download alias
        run: cp "dist/nodeseeker-${GITHUB_REF_NAME}.zip" dist/nodeseeker.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/nodeseeker-${GITHUB_REF_NAME}.zip"
          "dist/nodeseeker.zip"
          --title "NodeSeeker $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
